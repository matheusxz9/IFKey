name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_HOST: localhost
  DB_PORT: "5434"
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_NAME: ifkey_db
  JWT_SECRET: ci-secret
  THROTTLE_TTL: "60000"
  THROTTLE_LIMIT: "100000"
  CORS_ORIGIN: http://localhost:5173
  SUAP_CLIENT_ID: ci-client-id
  SUAP_CLIENT_SECRET: ci-client-secret
  SUAP_REDIRECT_URI: http://localhost:5173/login/suap/callback
  VITE_API_URL: http://localhost:3000/api
  VITE_CLIENT_ID: ci-client-id
  VITE_REDIRECT_URI: http://localhost:5173/login/suap/callback

jobs:
  backend:
    name: Backend (lint, build, testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ifkey_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        working-directory: backend
        run: npm ci
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Testes unitários
        working-directory: backend
        run: npm test
      - name: Rodar migrations
        working-directory: backend
        run: npm run migration:run
      - name: Testes e2e
        working-directory: backend
        run: npm run test:e2e

  frontend-e2e:
    name: Frontend (lint, tipos, Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ifkey_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci
      - name: Rodar migrations
        working-directory: backend
        run: npm run migration:run
      - name: Popular o banco (seed)
        working-directory: backend
        run: npm run seed
      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar navegadores do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build de produção
        working-directory: frontend
        run: npm run build
      - name: Testes E2E (Playwright)
        working-directory: frontend
        run: npm run test:e2e
      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
